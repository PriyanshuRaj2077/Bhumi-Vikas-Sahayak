<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bvs-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2802B" />
      <stop offset="60%" stop-color="#EF7B45" />
      <stop offset="100%" stop-color="#DB551D" />
    </linearGradient>
    <linearGradient id="bvs-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Campus-Connect Squircle Container -->
  <rect width="64" height="64" rx="17" fill="url(#bvs-bg-grad)" />
  <rect x="1" y="1" width="62" height="62" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1.2" />

  <!-- Golden Sun Disc -->
  <circle cx="32" cy="11.5" r="3.5" fill="url(#bvs-gold-grad)" />

  <!-- Torana Crown / Upper Gateway Beam -->
  <path d="M 17 17.5 C 17 16.5 18 16 19.5 16 L 44.5 16 C 46 16 47 16.5 47 17.5 C 47 18.5 46 19 44.5 19 L 19.5 19 C 18 19 17 18.5 17 17.5 Z" fill="#FFFFFF" />
  <circle cx="17.5" cy="17.5" r="1.8" fill="url(#bvs-gold-grad)" />
  <circle cx="46.5" cy="17.5" r="1.8" fill="url(#bvs-gold-grad)" />

  <!-- Second Torana Crossbeam -->
  <rect x="20" y="21" width="24" height="2.5" rx="1.2" fill="#FFFFFF" fill-opacity="0.9" />

  <!-- Left Stepped Wing -->
  <path d="M 15 36 H 21 V 45 H 15 Z" fill="#FFFFFF" fill-opacity="0.8" />
  <line x1="18" y1="38" x2="18" y2="43" stroke="#EF7B45" stroke-width="1.2" stroke-linecap="round" />

  <!-- Right Stepped Wing -->
  <path d="M 43 36 H 49 V 45 H 43 Z" fill="#FFFFFF" fill-opacity="0.8" />
  <line x1="46" y1="38" x2="46" y2="43" stroke="#EF7B45" stroke-width="1.2" stroke-linecap="round" />

  <!-- Central Rising Development Tower -->
  <path d="M 23 25.5 H 41 V 45 H 23 Z" fill="#FFFFFF" />

  <!-- Central Gateway Portal -->
  <path d="M 29 45 V 36.5 C 29 34.8 30.3 33.5 32 33.5 C 33.7 33.5 35 34.8 35 36.5 V 45 Z" fill="#DB551D" />

  <!-- Pilasters -->
  <line x1="25.5" y1="27" x2="25.5" y2="43" stroke="#EF7B45" stroke-width="1.2" stroke-linecap="round" />
  <line x1="38.5" y1="27" x2="38.5" y2="43" stroke="#EF7B45" stroke-width="1.2" stroke-linecap="round" />

  <!-- Bhumi Base Foundation Line -->
  <rect x="11" y="47" width="42" height="3" rx="1.5" fill="#FFFFFF" />

  <!-- Blueprint Measurement Grid Ticks -->
  <line x1="14" y1="52.5" x2="50" y2="52.5" stroke="url(#bvs-gold-grad)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1.5 2.5" />
  <circle cx="14" cy="52.5" r="1.2" fill="url(#bvs-gold-grad)" />
  <circle cx="32" cy="52.5" r="1.2" fill="url(#bvs-gold-grad)" />
  <circle cx="50" cy="52.5" r="1.2" fill="url(#bvs-gold-grad)" />
</svg>
